name: Bug 报告
description: 报告插件运行中的错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，便于快速定位。
        提交前建议先在最新版本上复现一次。
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 见 package.json 或 DSH 插件列表
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统版本 / DSH 版本 / Chromium 版本
      placeholder: "Windows 11 23H2 / DSH x.y.z / Chrome 130"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与报错
      description: 有日志或堆栈请一并贴上
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新版本上复现
          required: true
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
