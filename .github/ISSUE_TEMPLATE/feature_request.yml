name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述实际场景与痛点（why），再谈方案（how）。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 什么场景下不方便？当前的做法是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望插件怎么表现
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 已知限制
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认不是重复
          required: true
